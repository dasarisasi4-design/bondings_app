<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b19"><title>BONDINGS — Find your connection</title><style>
:root{--bg:#100b19;--panel:#1d1528;--pink:#ff4f9a;--purple:#9b5cff;--muted:#b7afc2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px Inter,system-ui,sans-serif}.app{max-width:1120px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:16px;margin-bottom:18px}.brand{font-size:24px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--pink),#bd83ff);color:transparent;background-clip:text}.tag{color:var(--muted);font-size:12px}.spacer{flex:1}button{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(100deg,var(--pink),var(--purple));color:white;font-weight:700;cursor:pointer}.ghost{background:#2a2036}.tools{display:flex;gap:10px;align-items:center;margin:14px 0 18px}.tools span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.person{height:290px;border-radius:16px;overflow:hidden;position:relative;background:#2a2036;cursor:pointer}.person img{width:100%;height:100%;object-fit:cover}.person:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#09060ddd)}.info{position:absolute;z-index:1;bottom:12px;left:12px}.name{font-weight:800}.dist{font-size:11px;color:#e2d9e9}.online{position:absolute;z-index:2;top:12px;left:12px;width:10px;height:10px;background:#43e69a;border:2px solid #100b19;border-radius:50%}.like{position:absolute;z-index:2;right:10px;top:8px;background:#160f20bb;padding:6px 9px;border-radius:50%;font-size:20px}.nav{position:sticky;bottom:12px;margin:22px auto 0;display:flex;justify-content:space-around;gap:5px;padding:10px;background:#21172d;border:1px solid #382942;border-radius:18px;max-width:650px}.nav button{background:transparent;color:var(--muted)}.nav button.active{background:#42213e;color:#ff80b5}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:4;align-items:center;justify-content:center;padding:18px}.dialog{background:var(--panel);padding:20px;border-radius:18px;width:min(420px,100%)}.dialog img{width:100%;height:250px;object-fit:cover;border-radius:12px}.dialog p{color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.person{height:220px}.app{padding:12px}.brand{font-size:21px}}@media(max-width:420px){.person{height:180px}.name{font-size:12px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">BONDINGS</div><div class="tag">Find your kind of connection</div></div><div class="spacer"></div><button class="ghost" onclick="alert('Filter controls are a prototype.')">⚙ Filters</button></header><div class="tools"><b>● NEAR YOU</b><div class="spacer"></div><span>Sample profiles</span></div><section class="grid" id="grid"></section><nav class="nav"><button class="active" onclick="showTab('Discover',this)">▦ Discover</button><button onclick="showTab('Likes',this)">♡ Likes</button><button onclick="showTab('Chat',this)">▢ Chat</button><button onclick="showTab('Premium',this)">♛ Premium</button><button onclick="showTab('Profile',this)">◉ Profile</button></nav></main><div class="modal" id="modal" onclick="if(event.target===this)this.style.display='none'"><div class="dialog" id="dialog"></div></div><script>
const people=[['Aarav',25,'1 km away','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600'],['Rohan',27,'2 km away','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600'],['Kiran',24,'3 km away','https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600'],['Dev',29,'4 km away','https://images.unsplash.com/photo-1535713875002-d1d0cf3771d0?w=600'],['Sam',26,'5 km away','https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=600'],['Aditya',28,'6 km away','https://images.unsplash.com/photo-1504593811423-6dd665756598?w=600'],['Neil',26,'7 km away','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600'],['Arjun',30,'8 km away','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600']];let likes=new Set();const grid=document.querySelector('#grid');people.forEach((p,i)=>{let c=document.createElement('article');c.className='person';c.innerHTML=`<img src="${p[3]}" alt="Sample profile photo"><span class="online"></span><button class="like" aria-label="Like profile">♡</button><div class="info"><div class="name">${p[0]}, ${p[1]}</div><div class="dist">${p[2]}</div></div>`;c.querySelector('.like').onclick=e=>{e.stopPropagation();likes.has(i)?likes.delete(i):likes.add(i);e.currentTarget.textContent=likes.has(i)?'♥':'♡'};c.onclick=()=>{document.querySelector('#dialog').innerHTML=`<img src="${p[3]}"><h2>${p[0]}, ${p[1]}</h2><p>${p[2]} · Sample profile preview</p><button onclick="document.querySelector('#modal').style.display='none'">Close</button>`;document.querySelector('#modal').style.display='flex'};grid.append(c)});function showTab(t,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(t==='Discover'){grid.style.display='grid';return}grid.style.display='none';document.querySelector('#dialog').innerHTML=`<h2>${t}</h2><p>${t==='Likes'?likes.size+' profiles liked':t==='Premium'?'Plus ₹199/month · Premium ₹399/month — demo pricing, payments not connected':t==='Chat'?'Chat UI placeholder — live messaging not connected':'Profile setup placeholder'}</p><button onclick="document.querySelector('#modal').style.display='none'">Close</button>`;document.querySelector('#modal').style.display='flex'}
</script></body></html>
